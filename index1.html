<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Eye Control + Arduino UNO</title>

<style>
body {
  font-family: Arial;
  background: #222;
  color: #eee;
}
#video {
  width: 480px;
  border: 2px solid #444;
}
#status {
  color: #0f0;
  margin-top: 10px;
}
button {
  margin: 5px;
  padding: 10px;
}
#debug {
  white-space: pre;
  background:#111;
  padding:10px;
  border:1px solid #333;
  width:400px;
}
</style>

</head>

<body>

<h2>Eye Control + Arduino UNO</h2>

<video id="video" autoplay playsinline></video>
<div id="status">Status : Initialisation...</div>

<button id="connectBtn" disabled>Connexion Arduino</button>
<button id="startBtn" disabled>Démarrer Tracking</button>
<button id="stopBtn" disabled>Stop</button>

<h3>Debug</h3>
<div id="debug"></div>

<script type="module">

//------------------------------------
// 1. Activer webcam
//------------------------------------
const video = document.getElementById("video");
const statusTxt = document.getElementById("status");
const connectBtn = document.getElementById("connectBtn");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const debug = document.getElementById("debug");

let port = null;
let writer = null;

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 480, height: 360 }
        });
        video.srcObject = stream;
        statusTxt.textContent = "Webcam OK ✔";
        connectBtn.disabled = false;
        startBtn.disabled = false;
    } catch (err) {
        statusTxt.textContent = "Erreur webcam : " + err;
        console.error(err);
    }
}

startCamera();

//------------------------------------
// 2. Connexion Arduino UNO via Web Serial
//------------------------------------
connectBtn.onclick = async () => {
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        writer = port.writable.getWriter();
        statusTxt.textContent = "Arduino connecté ✔";
    } catch (err) {
        alert("Erreur connexion Arduino : " + err);
    }
};

function sendToArduino(cmd) {
    if (!writer) return;
    const data = new TextEncoder().encode(cmd + "\n");
    writer.write(data);
}

//------------------------------------
// 3. TRACKING — Version minimale pour vérifier webcam + boutons
//------------------------------------
let tracking = false;

startBtn.onclick = () => {
    tracking = true;
    statusTxt.textContent = "Tracking actif ✔";
    debug.textContent += "Tracking démarré\n";
};

stopBtn.onclick = () => {
    tracking = false;
    statusTxt.textContent = "Tracking stoppé";
    debug.textContent += "Tracking arrêté\n";
};

//------------------------------------
// 4. Boucle debug (affiche juste FPS et état)
//------------------------------------
function loop() {
    if (tracking) {
        debug.textContent =
            "Tracking ON\n" +
            "Video frame : OK\n" +
            "(Ici viendra la détection yeux + iris)\n";
    }
    requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
